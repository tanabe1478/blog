name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  blog:
    name: Blog
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run script tests
        run: python3 -m unittest discover -s tests/scripts -p 'test_*.py'
      - name: Check out pinned MoonBit SSG
        uses: actions/checkout@v4
        with:
          repository: tanabe1478/moonbit-ssg
          ref: 659000a7a7a2779cbca535c52a99c64bdcce3be1
          path: .build/moonbit-ssg
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true
      - name: Install pinned MoonBit toolchain
        working-directory: .build/moonbit-ssg
        run: |
          mise trust
          mise install
      - name: Build and check MoonBit site
        env:
          MOONBIT_SSG_DIR: .build/moonbit-ssg
        run: scripts/prepare_for_deploy.py --skip-images

  cms:
    name: CMS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run checks
        run: npm run check
      - name: Upload CMS E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cms-e2e-check-${{ github.run_id }}
          path: |
            cms/playwright-report
            cms/test-results
          if-no-files-found: ignore
          retention-days: 7
