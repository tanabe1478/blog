name: Check

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  blog:
    name: Blog
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Run script tests
        run: python3 -m unittest discover -s tests/scripts -p 'test_*.py'
      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          install: false
          cache: true
      - name: Install pinned MoonBit toolchain
        run: |
          mise trust
          mise install
      - name: Check and test the site generator
        run: |
          mise exec -- moon update
          mise exec -- moon fmt --check
          mise exec -- moon test
      - name: Restore drawn Mermaid diagrams and Chromium
        uses: actions/cache@v4
        with:
          path: |
            .cache/mermaid
            ~/Library/Caches/ms-playwright
          key: mermaid-${{ runner.os }}-${{ hashFiles('scripts/highlight/package-lock.json', 'scripts/highlight/mermaid.mjs') }}-${{ hashFiles('Content/**/*.md') }}
          restore-keys: |
            mermaid-${{ runner.os }}-${{ hashFiles('scripts/highlight/package-lock.json', 'scripts/highlight/mermaid.mjs') }}-
            mermaid-${{ runner.os }}-
      - name: Test the highlight scripts
        run: |
          mise exec -- npm ci --prefix scripts/highlight --no-audit --no-fund
          mise exec -- npm exec --prefix scripts/highlight -- playwright install chromium
          mise exec -- npm test --prefix scripts/highlight
      - name: Build and check MoonBit site
        run: scripts/prepare_for_deploy.py --skip-images

  cms:
    name: CMS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cms
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cms/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run checks
        run: npm run check
      - name: Upload CMS E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cms-e2e-check-${{ github.run_id }}
          path: |
            cms/playwright-report
            cms/test-results
          if-no-files-found: ignore
          retention-days: 7
